name: u_sports_mobile
description: U-Sports mobile app for athletes and guests
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  supabase_flutter: ^2.5.4
  firebase_core: ^3.3.0
  firebase_messaging: ^15.1.0
  go_router: ^14.2.0
  cached_network_image: ^3.3.1
  intl: ^0.19.0
  image_picker: ^1.1.2
  file_picker: ^8.0.7
  photo_view: ^0.15.0
  share_plus: ^9.0.0
  flutter_local_notifications: ^17.2.2
  shimmer: ^3.0.0
  lottie: ^3.1.2
  http: ^1.2.2
  shared_preferences: ^2.3.2
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.10
  riverpod_generator: ^2.4.3

flutter:
  uses-material-design: true
  # Add Barlow Condensed + DM Sans under assets/fonts/ when you bundle real .ttf files (see web public/fonts).
  assets:
    - assets/images/
    - assets/icons/
