name: u_sports_mobile
description: U-Sports mobile app for athletes and guests
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  supabase_flutter: ^2.5.4
  firebase_core: ^3.3.0
  firebase_messaging: ^15.1.0
  go_router: ^14.2.0
  cached_network_image: ^3.3.1
  intl: ^0.19.0
  image_picker: ^1.1.2
  file_picker: ^8.0.7
  photo_view: ^0.15.0
  share_plus: ^9.0.0
  flutter_local_notifications: ^17.2.2
  shimmer: ^3.0.0
  lottie: ^3.1.2
  http: ^1.2.2
  shared_preferences: ^2.3.2
  url_launcher: ^6.3.0
  connectivity_plus: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.10
  riverpod_generator: ^2.4.3
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true
  # Add Barlow Condensed + DM Sans under assets/fonts/ when you bundle real .ttf files (see web public/fonts).
  assets:
    - assets/images/
    - assets/icons/
    - assets/splash/

# App icon generation. Two source images:
#   app_icon.png            - full design, opaque background (iOS + legacy Android)
#   app_icon_foreground.png - glyph only, transparent background, padded to fit
#                             Android's adaptive-icon safe zone (composited over
#                             adaptive_icon_background below)
# Regenerate everything with:
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: assets/icons/app_icon.png
  adaptive_icon_background: '#0066FF'
  adaptive_icon_foreground: assets/icons/app_icon_foreground.png

# Splash screen shown natively before Flutter's first frame. Uses brand blue
# for both light/dark (not the app's theme backgrounds) because the logo mark
# and wordmark are white — white-on-near-white (the light theme bg) would be
# invisible, and blue matches the app icon's own look either way.
# Regenerate with:
#   dart run flutter_native_splash:create
flutter_native_splash:
  color: '#0066FF'
  color_dark: '#0066FF'
  image: assets/splash/splash_logo.png
  branding: assets/splash/splash_branding.png
  branding_dark: assets/splash/splash_branding.png
  branding_mode: bottom
  android_12:
    color: '#0066FF'
    color_dark: '#0066FF'
    image: assets/splash/splash_logo.png
    icon_background_color: '#0066FF'
    icon_background_color_dark: '#0066FF'
