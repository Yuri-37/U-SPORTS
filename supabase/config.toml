# Supabase local configuration
project_id = "u-sports"

[api]
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
port = 54323

# Local email catcher (Supabase CLI runs Mailpit; this table name is kept for compatibility).
# After `supabase start`, open the inbox at http://127.0.0.1:54324
[inbucket]
enabled = true
port = 54324

# Loosen local auth throttling so signup / magic-link / OTP testing is not blocked.
[auth.rate_limit]
sign_in_sign_ups = 100
token_verifications = 100

[auth]
# NOTE: this block configures the LOCAL stack only (`supabase start`). The
# hosted project is configured in the dashboard under
# Authentication -> URL Configuration, and it must carry the same entries.
#
# Password reset sends redirectTo=<origin>/auth/reset-password (web) and
# usports://reset-password (mobile). Supabase silently IGNORES a redirectTo
# that is not on the allow-list and substitutes Site URL instead -- which is
# why a reset link can arrive pointing at localhost even though the code asked
# for the deployed URL. If reset links land on the wrong host, the allow-list
# is what to check first.
site_url = "http://localhost:5173"
additional_redirect_urls = [
  "https://localhost:5173",
  "http://localhost:5173/auth/reset-password",
  "https://usports-one.vercel.app/**",
  "usports://reset-password",
]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
# Must be false for student registration to upload COR in the same session (storage RLS needs auth.uid()).
# On hosted Supabase: Auth → Email → disable "Confirm email" for the same flow, or confirm email then sign in and upload COR from profile.
enable_confirmations = false

[storage]
enabled = true

[realtime]
enabled = true
