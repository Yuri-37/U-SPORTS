<div style="background-color:#F3F4F8;padding:32px 16px;font-family:-apple-system,Segoe UI,Roboto,sans-serif;">
  <table role="presentation" width="100%" style="max-width:480px;margin:0 auto;background:#FFFFFF;border-radius:12px;overflow:hidden;border:1px solid #E0E2EC;">
    <tr>
      <td style="background-color:#002D62;padding:28px 32px;text-align:center;">
        <img src="https://gravatar.com/avatar/b3f8ae8b08f483491be6f250d56567ba6352e861a4ee805c72ca361bc5394051?v=1786844347000&size=256&d=initials" alt="U-Sports" style="height:48px;width:auto;" />
      </td>
    </tr>
    <tr>
      <td style="padding:32px;">
        <h1 style="margin:0 0 12px;font-size:20px;color:#12161F;">Set your password</h1>
        <p style="margin:0 0 24px;font-size:15px;line-height:1.6;color:#3E4557;">
          Use the button below to choose a password for your U-Sports account.
        </p>
        <table role="presentation" style="margin:0 auto;">
          <tr>
            <td style="border-radius:8px;background-color:#002D62;">
              <a href="{{ .SiteURL }}/auth/reset-password?token_hash={{ .TokenHash }}&type=recovery" style="display:inline-block;padding:12px 28px;font-size:15px;font-weight:600;color:#FFFFFF;text-decoration:none;border-radius:8px;">
                Reset password
              </a>
            </td>
          </tr>
        </table>
        <p style="margin:24px 0 0;font-size:12.5px;color:#666E85;">
          If you didn't request this, you can safely ignore this email — your password won't change.
        </p>
      </td>
    </tr>
  </table>
</div>
